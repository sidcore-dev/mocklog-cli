[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mocklog-cli"
version = "1.0.0"
description = "Generate realistic-looking synthetic log lines for testing log parsers and dashboards, with no dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "All Rights Reserved" }
authors = [{ name = "sidcore-dev" }]
keywords = ["logs", "synthetic-data", "testing", "cli", "devtools"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Environment :: Console",
    "Topic :: Software Development :: Testing",
]

[project.scripts]
mocklog-cli = "mocklog_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
